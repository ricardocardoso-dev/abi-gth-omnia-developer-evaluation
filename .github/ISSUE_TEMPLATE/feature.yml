name: Feature
about: Define one autonomous feature delivery unit
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this feature exists.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test Plan
      description: Unit/integration/e2e scenarios.
    validations:
      required: true
