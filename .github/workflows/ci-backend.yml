name: CI Backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore
        run: dotnet restore Wishlist.Backend.sln

      - name: Build
        run: dotnet build Wishlist.Backend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Wishlist.Backend.sln --configuration Release --no-build --verbosity normal
