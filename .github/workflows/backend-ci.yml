name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/**/*.slnx

      - name: Restore
        run: dotnet restore Wishlist.Backend.slnx

      - name: Build
        run: dotnet build Wishlist.Backend.slnx --no-restore

      - name: Test
        run: dotnet test Wishlist.Backend.slnx --no-build --verbosity normal
